function fyOptions(){ const y=fyStartYear(new Date()); return [0,1,2,3,4,5].map(i=>String(y-i)); }

function change(cur, prev, betterLow=false, money=true){
  if(prev==null) return '';
  const d = cur - prev; const pct = prev ? (d/prev*100) : null; const up = d > 0;
  const good = d === 0 ? null : (betterLow ? !up : up);
  const col = good===null ? '#7A8592' : good ? '#2E7D4F' : '#C62828';
  const amt = money ? inr(Math.abs(d)) : Math.abs(d).toLocaleString('en-IN');
  return `<div class="chg" style="color:${col}">${d===0?'':up?'&#9650; ':'&#9660; '}${d===0?'No change':amt}${pct===null?(d===0?'':' · new'):' · '+(pct>0?'+':'')+pct.toFixed(1)+'%'}</div>`;
}

/* ---------- tables with instant search (whole table and per column) ---------- */
function table(cols, rows, id, opts={}){
  id = id || 't'+(++drillSeq);
  const head = `<tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>` + (opts.colFilters===false?'':`<tr class="fr">${cols.map((c,i)=>`<th><input class="cf" data-col="${i}" placeholder="Filter" aria-label="Filter ${esc(c)}"></th>`).join('')}</tr>`);
  const body = rows.map(r => `<tr class="${r.on?'click':''}" ${r.on?`onclick="${r.on}"`:''} data-s="${esc((r.s || r.cells.map(x=>String(x).replace(/<[^>]+>/g,' ')).join(' ')).toLowerCase())}">${r.cells.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
  return `<table id="${id}" class="dt"><thead>${head}</thead><tbody>${body || `<tr class="empty"><td colspan="${cols.length}" class="muted">${opts.empty||'Nothing here yet.'}</td></tr>`}</tbody></table>
    <div class="muted nores" style="display:none;padding:8px">No match.</div>`;
}
function applyFilters(tableEl){
  const q = (tableEl._q || '').toLowerCase().trim().split(/\s+/).filter(Boolean);
  const cf = [...tableEl.querySelectorAll('.cf')].map(i=>[Number(i.dataset.col), i.value.toLowerCase().trim()]).filter(x=>x[1]);
  let shown = 0;
  tableEl.querySelectorAll('tbody tr:not(.empty)').forEach(tr => {
    const s = tr.dataset.s || '';
    const ok = q.every(w => s.includes(w)) && cf.every(([i, v]) => (tr.children[i]?.innerText || '').toLowerCase().includes(v));
    tr.style.display = ok ? '' : 'none'; if(ok) shown++;
  });
  const nr = tableEl.nextElementSibling; if(nr && nr.classList.contains('nores')) nr.style.display = shown ? 'none' : 'block';
  const cnt = document.querySelector(`[data-count="#${tableEl.id}"]`); if(cnt) cnt.textContent = shown;
}
function wireTable(scope=document){
  scope.querySelectorAll('input.ls').forEach(inp => { const t = document.querySelector(inp.dataset.ls); if(!t) return; inp.addEventListener('input', () => { t._q = inp.value; applyFilters(t); }); if(inp.value){ t._q = inp.value; applyFilters(t); } });
  scope.querySelectorAll('table.dt .cf').forEach(inp => inp.addEventListener('input', () => applyFilters(inp.closest('table'))));
  scope.querySelectorAll('table.dt .cf').forEach(inp => inp.addEventListener('click', e => e.stopPropagation()));
}
/* live search over cards/rows that carry data-s (used for lists that are not tables) */
function wireList(inputSel, itemSel){
  const inp = $(inputSel); if(!inp) return;
  const go = () => { const q = inp.value.toLowerCase().trim().split(/\s+/).filter(Boolean); $$(itemSel).forEach(el => { el.style.display = q.every(w => (el.dataset.s||'').includes(w)) ? '' : 'none'; }); };
  inp.addEventListener('input', go); go();
}

function lawForm(l={}){

    ${f('published_on','Recorded on','date')}${f('effective_on','Effective from','date')}
    <div style="grid-column:span 2">${f('old_position','Before (old position)','area')}</div><div style="grid-column:span 2">${f('new_position','Now (new position)','area')}</div>

async function acceptPortalCase(c){
  await q(sb.from('cases').update({status:'active', health:'On track', stage:'Accepted', filed_on:c.filed_on||TODAY}).eq('id',c.id));
  await q(sb.from('messages').insert({case_id:c.id, client_id:c.client_id, sender:'chamber', body:'Your case has been accepted by the chamber. We will share the next steps here.'}));
  dirty('cases','messages');
  if(S.settings.auto_brief_on_accept!==false){ toast('Case accepted. AI brief is being prepared in the background.'); fn('ai',{action:'summarize', case_id:c.id}).then(()=>{ dirty('cases'); toast('AI brief ready for '+c.title+'.'); if(S.detail?.id===c.id) render(); }).catch(()=>{}); }
  else toast('Case accepted and moved to active cases.');
  render();
}

/* ===== Drafts: create, open, review ===== */
const STD_FIELDS = [['client_name','Client name'],['client_phone','Client mobile'],['client_city','Client city'],['client_address','Client address'],['case_title','Case title'],['party','Our party'],['opposite_party','Opposite party'],['court','Court'],['bench','Bench'],['cnr','CNR'],['case_number','Case number'],['act_section','Sections'],['facts','Facts'],['next_date','Next date'],['today','Today\'s date'],['year','Year'],['chamber_name','Chamber name']];
function tplFields(body){ const std=new Set(), ask=new Set(); (body||'').replace(/\{\{\s*([^}]+?)\s*\}\}/g, (_,k)=>{ if(k.startsWith('ask:')) ask.add(k.slice(4).trim()); else std.add(k); }); return {std:[...std], ask:[...ask]}; }
async function createDraft(c, t){
  const cl = (await q(sb.from('clients').select('*').eq('id',c.client_id).maybeSingle())) || {};
  const [p1, p2] = c.title.split(/\s+v\.?\s+/i);

async function uploadFiles(files, c, clientId){
  const cid = c ? c.client_id : clientId;
  for(const f of files){
    const kind = f.type.startsWith('audio') ? 'audio' : f.type.startsWith('image') ? 'photo' : 'file';
    const path = `${cid}/${Date.now()}_${f.name.replace(/[^\w.\-]/g,'_')}`;
    toast('Uploading '+f.name+'...');
    const { error } = await sb.storage.from('case-files').upload(path, f);
    if(error){ toast('Upload failed: '+error.message); continue; }
    const ins = await q(sb.from('documents').insert({case_id:c?.id||null, client_id:cid, name:f.name, kind, storage_path:path, shared_by:isStaff()?'chamber':'client', status:'New', size_bytes:f.size}).select().single());

  }
  dirty('documents'); toast('Uploaded.'); render();
}

const ESTAGES = [['new','New enquiry'],['conflict','Conflict found'],['proposal','Fee proposal sent'],['accepted','Client accepted']];
function conflictCheck(e){
  const norm = s => (s||'').toLowerCase().replace(/[^a-z ]/g,'').trim();
  const opp = norm(e.opposite_party); const nm = norm(e.name);
  const hits = [];
  if(opp){ S.cache.clients.forEach(c=>{ if(norm(c.full_name) && (norm(c.full_name)===opp || norm(c.full_name).includes(opp) || opp.includes(norm(c.full_name)))) hits.push('The other side, '+e.opposite_party+', is an existing client ('+c.full_name+').'); });
    S.cache.cases.forEach(c=>{ const [a] = c.title.toLowerCase().split(/\s+v\.?\s+/); if(a && norm(a).length>2 && opp.includes(norm(a))) hits.push('The other side matches our party in '+c.title+'.'); }); }
  if(nm){ S.cache.cases.forEach(c=>{ const [,b] = c.title.toLowerCase().split(/\s+v\.?\s+/); if(b && norm(b).length>2 && (nm.includes(norm(b))||norm(b).includes(nm))) hits.push(e.name+' is the opposite party in our case '+c.title+'.'); }); }
  return [...new Set(hits)];
}

async function enquiryAction(a, e){
  const up = async (f, msg) => { await q(sb.from('enquiries').update({...f, updated_at:new Date().toISOString()}).eq('id',e.id)); dirty('enquiries'); toast(msg); render(); };
  const askFee = (then) => { const m = modal(`<h3>Fee proposal for ${esc(e.name)}</h3><label class="muted">Fee to propose (Rs)</label><input id="fp" type="number" value="${e.fee_proposed||''}"><div class="muted" style="margin-top:6px">${esc(e.summary||'')}</div><div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn" id="fk">Send proposal</button></div>`); m.querySelector('#fk').onclick = () => { const v=Number(m.querySelector('#fp').value)||null; m.close(); then(v); }; };
  if(a==='start'){
    const hits = S.settings.auto_conflict_check===false ? [] : conflictCheck(e);
    if(hits.length) return up({stage:'conflict', conflict_note:hits.join(' ')}, 'Conflict found. Review it before going ahead.');
    return askFee(v => up({stage:'proposal', conflict_note:'No conflict found with existing clients or cases.', fee_proposed:v}, 'No conflict found. Fee proposal recorded.'));
  }
  if(a==='clear') return askFee(v => up({stage:'proposal', fee_proposed:v, conflict_note:'Conflict reviewed and cleared by counsel. '+(e.conflict_note||'')}, 'Proposal recorded.'));
  if(a==='won'){
    let clientId = e.client_id;
    if(!clientId){ const cl = await q(sb.from('clients').insert({full_name:e.name, phone:e.phone, email:e.email, client_since:TODAY, referred_by:e.source}).select().single()); clientId = cl.id; }
    const title = e.name + (e.opposite_party ? ' v. '+e.opposite_party : ' matter');
    const cs = await q(sb.from('cases').insert({title, area:e.area, client_id:clientId, status:'active', stage:'Engaged', health:'Docs missing', facts:e.summary, fee_agreed:e.fee_proposed, filed_on:TODAY}).select().single());
    dirty('clients','cases');
    await up({stage:'accepted', client_id:clientId, case_id:cs.id}, 'Client and case created. Open the case to start work.');
    if(S.settings.auto_brief_on_accept!==false) fn('ai',{action:'summarize', case_id:cs.id}).then(()=>dirty('cases')).catch(()=>{});
    return;
  }
  if(a==='back'){
    if(e.stage==='accepted'){
      if(!confirm('Move back to Fee proposal? The case created for '+e.name+' will be removed (only if no work has been added to it).')) return;
      if(e.case_id){ const [{count:h},{count:d},{count:i}] = await Promise.all(['hearings','documents','invoices'].map(t=>sb.from(t).select('id',{count:'exact',head:true}).eq('case_id',e.case_id)));
        if((h||0)+(d||0)+(i||0)>0) return toast('This case already has hearings, documents or invoices. Close it from the case page instead.');
        await q(sb.from('enquiries').update({case_id:null}).eq('id', e.id));
        await q(sb.from('cases').delete().eq('id', e.case_id)); dirty('cases'); }
      return up({stage:'proposal', case_id:null}, 'Moved back to Fee proposal. The case created for it was removed.');
    }
    const prev = {conflict:'new', proposal: (e.conflict_note||'').startsWith('No conflict')?'new':'conflict'}[e.stage] || 'new';
    return up({stage:prev}, 'Moved back to '+ESTAGES.find(s=>s[0]===prev)[1]+'.');
  }
  if(a==='decline') return noteModal('Decline '+e.name, 'Reason (kept for your records)', v => up({declined:true, note:'Declined: '+v}, 'Declined. You can restore it any time.'));
  if(a==='restore') return up({declined:false}, 'Restored.');
}

/* ===== Bell notifications, payment reminders, due-payment pop-up ===== */
const remindDays = () => Number(S.settings.reminder_days ?? 5);
const dueSoon = i => !i.paid_on && i.due_on && i.due_on <= addDays(TODAY, remindDays());
function dueText(i){ const d = daysBetween(TODAY, i.due_on); return d < 0 ? 'overdue by '+(-d)+' day'+(d===-1?'':'s') : d===0 ? 'due today' : 'due in '+d+' day'+(d===1?'':'s'); }

async function buildNotifs(){
  const N = [];
  const add = (key, level, title, detail, when, go) => N.push({key, level, title, detail, when, go});
  const since = addDays(TODAY, -14);
  if(isStaff()){
    await load(['cases','hearings','invoices','enquiries','messages','drafts','law_updates','documents']);
    const C = S.cache; const tmw = addDays(TODAY, 1);
    C.hearings.filter(h=>h.hearing_date===TODAY || h.hearing_date===tmw).forEach(h=>add('h:'+h.id, 'high', (h.hearing_date===TODAY?'Hearing today: ':'Hearing tomorrow: ')+(h.cases?.title||''), (h.purpose||'')+' · '+(h.cases?.court||''), h.hearing_date, `openCase('${h.case_id}')`));
    C.cases.filter(c=>c.status==='active' && c.health==='Limitation').forEach(c=>add('lim:'+c.id, 'high', 'Limitation risk: '+c.title, c.stage||'', c.next_date||TODAY, `openCase('${c.id}')`));
    C.invoices.filter(dueSoon).forEach(i=>add('inv:'+i.id+':'+i.due_on, i.due_on<TODAY?'high':'mid', 'Payment '+dueText(i)+': '+(i.clients?.full_name||''), i.number+' · '+inr(invTotal(i))+(i.reminders?' · reminded '+i.reminders+'x':' · no reminder sent yet'), i.due_on, `invoiceView('${i.id}')`));
    C.cases.filter(c=>c.status==='intake').forEach(c=>add('int:'+c.id, 'mid', 'New case from client: '+c.title, c.clients?.full_name||'', (c.created_at||TODAY).slice(0,10), `openCase('${c.id}')`));
    C.enquiries.filter(e=>e.stage==='new' && !e.declined).forEach(e=>add('enq:'+e.id, 'mid', 'New enquiry: '+e.name, e.summary||'', (e.created_at||TODAY).slice(0,10), `S.tab='New intake';S.detail=null;render()`));
    C.messages.filter(m=>m.sender==='client' && m.created_at.slice(0,10)>=since).forEach(m=>add('msg:'+m.id, 'mid', 'Message from client · '+(m.cases?.title||''), m.body.slice(0,90), m.created_at.slice(0,10), `openCase('${m.case_id}')`));
    C.documents.filter(d=>d.shared_by==='client' && d.created_at.slice(0,10)>=since).forEach(d=>add('doc:'+d.id, 'low', 'Client shared '+(d.kind==='audio'?'a voice note':'a document'), d.name+' · '+(d.cases?.title||''), d.created_at.slice(0,10), d.case_id?`openCase('${d.case_id}')`:''));
    C.drafts.filter(d=>d.status==='Draft').forEach(d=>add('dr:'+d.id+':'+(d.version||1), 'low', 'Draft awaiting approval: '+d.title, d.cases?.title||'', d.created_at.slice(0,10), `openDraft('${d.id}')`));
    C.law_updates.filter(l=>l.level==='High' && (l.published_on||'')>=addDays(TODAY,-30)).forEach(l=>add('law:'+l.id, 'mid', 'Law change: '+l.title, l.source||'', l.published_on, `lawModal('${l.id}')`));
  } else {
    await load(['cases','hearings','invoices','messages']);
    const C = S.cache;
    C.invoices.filter(dueSoon).forEach(i=>add('inv:'+i.id+':'+i.due_on+':'+(i.reminders||0), i.due_on<TODAY?'high':'mid', 'Payment '+dueText(i)+': '+inr(invTotal(i)), i.number+' · '+(i.cases?.title||''), i.due_on, `invoiceView('${i.id}')`));
    C.hearings.filter(h=>h.hearing_date>=TODAY && h.hearing_date<=addDays(TODAY,3)).forEach(h=>add('h:'+h.id, 'high', (h.hearing_date===TODAY?'Hearing today':'Hearing on '+fd(h.hearing_date))+': '+(h.cases?.title||''), (h.purpose||'')+' · '+(h.cases?.court||''), h.hearing_date, `openCase('${h.case_id}')`));
    C.cases.forEach(c=>{ const n=(c.missing_docs||[]).length; if(n) add('md:'+c.id+':'+n, 'mid', n+' document'+(n===1?'':'s')+' needed from you', c.title, TODAY, `openCase('${c.id}')`); });
    C.messages.filter(m=>m.sender==='chamber' && m.created_at.slice(0,10)>=since).forEach(m=>add('msg:'+m.id, 'low', 'Message from the chamber', m.body.slice(0,90), m.created_at.slice(0,10), `S.tab='Messages';S.view.mcase='${m.case_id}';S.detail=null;render()`));
  }
  const rank = {high:0, mid:1, low:2};
  return N.sort((a,b)=>rank[a.level]-rank[b.level] || String(b.when).localeCompare(String(a.when)));
}
async function saveSeen(keys){
  keys.forEach(k=>S.seen.add(k));
  const arr = [...S.seen].slice(-800);
  try { await sb.from('notif_state').upsert({user_id:S.user.id, seen:arr, updated_at:new Date().toISOString()}); } catch(e){}
}
async function updateBell(){
  try { const N = await buildNotifs(); const n = N.filter(x=>!S.seen.has(x.key)).length;
    $$('.bellcount').forEach(b=>{ b.textContent = n>99?'99+':n; b.style.display = n?'':'none'; }); } catch(e){}
}
async function openBell(){
  const N = await buildNotifs(); let showAll = false;
  const m = modal(`<h3>Reminders <span class="muted" id="bn"></span></h3><div class="chips" style="margin-bottom:8px"><button class="chip on" data-bf="new">Unread</button><button class="chip" data-bf="all">All</button><button class="btn ghost sm" id="bread" style="margin-left:auto">Mark all as read</button></div><div id="blist"></div>`, {onClose:updateBell});
  const draw = () => {
    const list = N.filter(x=>showAll || !S.seen.has(x.key));
    m.querySelector('#bn').textContent = N.filter(x=>!S.seen.has(x.key)).length+' unread';
    m.querySelector('#blist').innerHTML = list.map((x,i)=>`<div class="row click bitem ${S.seen.has(x.key)?'read':''}" data-bi="${N.indexOf(x)}"><span class="bdot ${x.level}"></span><div style="flex:1;min-width:0"><b>${esc(x.title)}</b><div class="muted" style="white-space:normal">${esc(x.detail)}</div></div><span class="muted">${fdShort(x.when)}</span></div>`).join('') || `<div class="muted" style="padding:14px 0">${showAll?'Nothing to show.':'You are all caught up.'}</div>`;
    m.querySelectorAll('[data-bi]').forEach(r=>r.onclick=async()=>{ const x=N[r.dataset.bi]; await saveSeen([x.key]); m.remove(); updateBell(); if(x.go) new Function(x.go)(); });
  };
  m.querySelectorAll('[data-bf]').forEach(b=>b.onclick=()=>{ showAll = b.dataset.bf==='all'; m.querySelectorAll('[data-bf]').forEach(c=>c.classList.toggle('on', c===b)); draw(); });
  m.querySelector('#bread').onclick = async () => { await saveSeen(N.map(x=>x.key)); draw(); updateBell(); };
  draw();
}
document.addEventListener('click', e => { if(e.target.closest('.bell')) openBell(); });

/* staff: send payment reminders */
function reminderText(i){
  const st = S.settings; const name = (i.clients?.full_name||'').split(' ')[0];
  return `Dear ${name}, this is a gentle reminder that invoice ${i.number} for ${inr(invTotal(i))} (including GST)${i.cases?.title?' for '+i.cases.title:''} is ${dueText(i)}${i.due_on?' ('+fd(i.due_on)+')':''}. You can pay from the Payments tab of your portal${st.upi_id?' or by UPI to '+st.upi_id:''}. Please ignore this if already paid. Thank you, ${st.chamber_name||'Takshila'}`;
}
async function sendReminder(i, body){
  await q(sb.from('messages').insert({case_id:i.case_id, client_id:i.client_id, sender:'chamber', body}));
  await q(sb.from('invoices').update({reminders:(i.reminders||0)+1, last_reminder_at:new Date().toISOString()}).eq('id', i.id));
  i.reminders = (i.reminders||0)+1;
}
async function reminderModal(id){
  await load(['invoices','clients']);
  const i = S.cache.invoices.find(x=>x.id===id); const cl = S.cache.clients.find(c=>c.id===i.client_id) || {};
  const phone = (cl.phone||'').replace(/\D/g,''); const waOk = phone.length>=10 && !/x/i.test(cl.phone||'');
  const m = modal(`<h3>Payment reminder · ${esc(i.number)}</h3>
    <div class="muted" style="margin-bottom:8px">${esc(cl.full_name||'')} · ${inr(invTotal(i))} · ${dueText(i)}${i.reminders?' · already reminded '+i.reminders+'x, last '+ftime(i.last_reminder_at):''}</div>
    <label class="muted">Message (you can edit it)</label><textarea id="rmb" rows="6">${esc(reminderText(i))}</textarea>
    <div class="muted" style="margin-top:8px">The client gets it in Messages, in their bell, and as a pop-up at sign-in until the invoice is paid.</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap">
     ${waOk?'<button class="btn ghost" id="rmw">Send + open WhatsApp</button>':''}${cl.email?'<button class="btn ghost" id="rme">Send + open email</button>':''}<button class="btn" id="rms">Send in portal</button></div>`);
  const go = async extra => { const body = m.querySelector('#rmb').value.trim(); if(!body) return; await sendReminder(i, body); if(extra) extra(body); m.close(); dirty('invoices','messages'); toast('Reminder sent to '+(cl.full_name||'client')+'.'); render(); };
  m.querySelector('#rms').onclick = () => go();
  if(m.querySelector('#rmw')) m.querySelector('#rmw').onclick = () => go(b => window.open('https://wa.me/'+(phone.length===10?'91'+phone:phone)+'?text='+encodeURIComponent(b), '_blank'));
  if(m.querySelector('#rme')) m.querySelector('#rme').onclick = () => go(b => { location.href = 'mailto:'+cl.email+'?subject='+encodeURIComponent('Payment reminder: '+i.number)+'&body='+encodeURIComponent(b); });
}
async function bulkReminders(){
  await load(['invoices']);
  const list = S.cache.invoices.filter(dueSoon).sort((a,b)=>a.due_on.localeCompare(b.due_on));
  if(!list.length) return toast('No invoices are overdue or due in the next '+remindDays()+' days.');
  const m = modal(`<h3>Send payment reminders</h3><div class="muted" style="margin-bottom:8px">Unpaid invoices that are overdue or due in the next ${remindDays()} days. Each client gets a personal message in the portal.</div>
    <label class="tog" style="border-bottom:1px solid #E4DFD4"><input type="checkbox" id="rall" checked><span><b>Select all</b></span></label>
    ${list.map(i=>`<label class="tog"><input type="checkbox" class="rsel" value="${i.id}" checked><span style="flex:1"><b>${esc(i.clients?.full_name||'')}</b> · ${esc(i.number)} · ${inr(invTotal(i))}<div class="muted">${i.due_on<TODAY?'<b style="color:#C62828">'+dueText(i)+'</b>':dueText(i)}${i.reminders?' · reminded '+i.reminders+'x, last '+fd(i.last_reminder_at):' · not reminded yet'}</div></span></label>`).join('')}
    <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" id="rgo">Send reminders</button></div>`, {wide:true});
  m.querySelector('#rall').onchange = e => m.querySelectorAll('.rsel').forEach(c=>c.checked=e.target.checked);
  m.querySelector('#rgo').onclick = async e => { const ids=[...m.querySelectorAll('.rsel:checked')].map(c=>c.value); if(!ids.length) return toast('Select at least one.'); e.target.disabled=true; e.target.textContent='Sending...';

}
/* ===== Install as an app on phone and desktop ===== */
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
let deferredInstall = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const installDismissed = () => { try { return localStorage.getItem('tk_install_hide')==='1'; } catch { return false; } };
function installBanner(){
  if(isStandalone() || installDismissed() || $('#instbar')) return;
  if(!deferredInstall && !isIOS()) return;
  const b = document.createElement('div'); b.id='instbar';
  b.innerHTML = `<img src="icons/icon-192.png" alt=""><div style="flex:1;min-width:0"><b>Install Takshila</b><div>${deferredInstall?'Open it like an app from your home screen.':'Tap the Share button <span style="font-size:15px">&#x2191;&#xFE0E;</span> in Safari, then <b>Add to Home Screen</b>.'}</div></div>${deferredInstall?'<button class="btn sm" id="instgo">Install</button>':''}<button class="instx" aria-label="Close">&times;</button>`;
  document.body.appendChild(b);
  b.querySelector('.instx').onclick = () => { b.remove(); try { localStorage.setItem('tk_install_hide','1'); } catch {} };
  if(b.querySelector('#instgo')) b.querySelector('#instgo').onclick = async () => { deferredInstall.prompt(); await deferredInstall.userChoice.catch(()=>{}); deferredInstall=null; b.remove(); };
}
function installApp(){
  if(isStandalone()) return toast('Takshila is already installed on this device.');
  if(deferredInstall){ deferredInstall.prompt(); deferredInstall.userChoice.finally(()=>{ deferredInstall=null; $('#instbar')?.remove(); }); return; }
  modal(`<h3>Install Takshila</h3>${isIOS()?'<ol class="ul"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button at the bottom.</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>':'<ol class="ul"><li>Open this page in <b>Chrome</b> (Android) or Chrome/Edge (computer).</li><li>Tap the <b>&#8942;</b> menu at the top right.</li><li>Choose <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>'}<div class="muted" style="margin-top:8px">The app opens full screen with its own icon and stays signed in.</div>`);
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; installBanner(); });
window.addEventListener('appinstalled', () => { $('#instbar')?.remove(); toast('Takshila installed. Open it from your home screen.'); });
setTimeout(installBanner, 2500);
document.addEventListener('click', e => { if(e.target.closest('[data-install]')) installApp(); });
